name = "tensorRewriteExperiment"
version = "0.1.0"
defaultTargets = ["TensorRewrite", "TensorRewriteLibraries", "TensorRewriteTheory"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[require]]
name = "floatlib"
git = "https://github.com/lean-dojo/FloatLib.git"
rev = "acba2057e452f32f4ed4f06bb0adbeda5342ba92"

[[lean_lib]]
name = "TensorRewrite"

[[lean_lib]]
name = "TensorRewriteLibraries"
roots = ["TensorRewriteLibraries"]

[[lean_lib]]
name = "TensorRewriteTheory"
roots = ["TensorRewriteTheory"]
